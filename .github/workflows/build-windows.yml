name: Build Windows

# Building natively on a windows-latest GitHub-hosted runner, matching how
# an officer's own machine builds/runs this — Wails v3's Windows backend no
# longer needs CGO (CGO_ENABLED=0 is the Taskfile default), so a macOS-hosted
# cross-compile is possible for a quick local smoke-test build, but CI stays
# native for a real Windows machine to actually exercise WebView2 on.
#
# Two ways this runs:
#   - push to main / manual dispatch: unversioned "dev" build, uploaded
#     as an Actions artifact only (Summary page) — for trying a change
#     out before cutting a release.
#   - push of a "vX.Y.Z" tag: versioned build (via -ldflags -X
#     main.Version=vX.Y.Z) published as a GitHub Release with the .exe
#     attached. This is what app.go's CheckForUpdate() compares running
#     officers' builds against, and what officers should actually
#     install — no installer, no separate WebView2 install needed (it
#     ships on Windows 11 and most up-to-date Windows 10 machines
#     already), just download the .exe from the release and run it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      # APP_VERSION feeds build/windows/Taskfile.yml's build:native task,
      # which -X main.Version=$APP_VERSION's it into the ldflags — see that
      # file for why it's a plain Task CLI var rather than a wails3 build
      # flag (wails3 build has no -ldflags passthrough of its own).
      - name: Build
        run: wails3 task windows:build:native ARCH=amd64 APP_VERSION=${{ steps.version.outputs.value }}

      # PLAN.md §11 Phase 7.2 — internal/updatecheck.Apply verifies this
      # digest before swapping a downloaded exe into place, so it must ship
      # with every build the app might self-update to, not just tagged
      # releases. sha256sum's "hex  filename" output is what
      # downloadChecksum expects (it just takes the first whitespace-
      # separated field, so a bare hex string would also work).
      - name: Compute checksum
        shell: bash
        run: |
          cd bin
          sha256sum seekers-epgp-parser.exe > seekers-epgp-parser.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: seekers-epgp-parser-windows
          path: |
            bin/*.exe
            bin/*.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.exe
            bin/*.sha256
          generate_release_notes: true
