name: Build Windows

# Cross-compiling this app for Windows from macOS isn't practical — Wails'
# Windows backend links against WebView2 via CGO, which needs a real
# MinGW toolchain to cross-compile reliably. Building natively on a
# windows-latest GitHub-hosted runner sidesteps that entirely. Download
# the seekers-epgp-parser-windows artifact from the run's Summary page,
# unzip it on the Windows machine, and run the .exe directly — no
# installer, no separate WebView2 install needed (it ships on Windows 11
# and most up-to-date Windows 10 machines already).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: wails build -platform windows/amd64

      - uses: actions/upload-artifact@v4
        with:
          name: seekers-epgp-parser-windows
          path: build/bin/*.exe
          if-no-files-found: error
